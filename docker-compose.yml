services:
  # ---- CPU (default) ----
  experiment:
    build:
      context: .
      args:
        DEVICE: cpu
    volumes:
      - ./outputs:/workspace/outputs
    entrypoint: ["python", "run_experiment.py"]

  visualize:
    build:
      context: .
      args:
        DEVICE: cpu
    volumes:
      - ./outputs:/workspace/outputs
    entrypoint: ["python", "visualize.py"]

